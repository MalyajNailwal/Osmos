name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install
        # --python pinned, not left to uv's default "newest available": uv
        # otherwise picks 3.15, too new for pydantic-core's prebuilt wheels —
        # forces a source build that fails (PyO3 doesn't support 3.15 yet).
        # 3.13 matches pyproject's declared floor.
        run: uv sync --extra dev --python 3.13

      - name: Test
        run: uv run pytest
